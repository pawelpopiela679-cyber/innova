  <a class="hot" href="kontakt.html" style="left:70%; top:84.5%; width:14%; height:6%;" aria-label="Przejdź do kontaktu"></a>

  <form id="zapisyForm" onsubmit="return submitDemo(event, 'zapisySuccess')">
    <input class="field" aria-label="Imię dziecka" name="childName" required style="left:58.7%; top:42%; width:17%; height:4.7%;">
    <input class="field" aria-label="Wiek dziecka" name="childAge" type="number" min="1" max="18" required style="left:78.5%; top:42%; width:9.3%; height:4.7%;">
    <input class="field" aria-label="Adres e-mail" name="parentEmail" type="email" required style="left:58.7%; top:49.5%; width:29%; height:4.7%;">
    <input class="field" aria-label="Numer telefonu" name="parentPhone" required style="left:58.7%; top:57%; width:29%; height:4.7%;">
    <input class="checkbox" type="checkbox" name="consent" required aria-label="Zgoda" style="left:58.7%; top:63.5%; width:1.3%; height:2.3%;">
    <button type="submit" class="hot" style="left:59%; top:68%; width:25%; height:5.5%; background:transparent; border:none; padding:0;" aria-label="Wyślij zgłoszenie"></button>
  </form>
  <div id="zapisySuccess" class="success-panel" style="left:54.5%; top:31%; width:33.5%; height:46%;">
    <div class="emoji">🎉</div>
    <h3>Dziękujemy za zgłoszenie!</h3>
    <p>(To makieta — w prawdziwej wersji zgłoszenie trafia e-mailem do pracowni.)</p>
  </div>

  <a class="hot" href="https://facebook.com/innova.pracownia" style="left:76.1%; top:95.2%; width:2.1%; height:3.2%;" aria-label="Facebook"></a>
  <a class="hot" href="https://instagram.com/innova_pracownia" style="left:78.5%; top:95.2%; width:2.1%; height:3.2%;" aria-label="Instagram"></a>
</div>
<div class="demo-badge">Makieta — kliknij po menu</div>
<script>
function submitDemo(e, panelId) {
  e.preventDefault();
  document.getElementById(panelId).classList.add('show');
  e.target.style.display = 'none';
  return false;
}
</script>
</body>
</html>
